[project]
name = "cc-usage-study"
version = "0.1.0"
description = "Claude Code usage analysis: live Opus 5.5 benchmarks across CLI, T3 Code, and Claude Desktop, compaction caching model, and offline log analyzer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Ilja Nevolin"}]
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/inevolin/claude-code-usage-analysis"
Repository = "https://github.com/inevolin/claude-code-usage-analysis"

[project.scripts]
cc-usage-simulate = "cc_usage_study.simulate:main"
cc-usage-analyze = "cc_usage_study.analyze:main"
cc-usage-benchmark = "cc_usage_study.benchmark:main"
cc-usage-experiments = "cc_usage_study.experiments:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=benchmarks --ignore=fixtures"
