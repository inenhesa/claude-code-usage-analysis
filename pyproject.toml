[project]
name = "cc-usage-study"
version = "0.1.0"
description = "Does compacting Claude Code earlier actually save usage? Caching model, offline log analyzer, and benchmark suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Ilja Nevolin"}]

[project.urls]
Homepage = "https://github.com/inevolin/claude-code-compaction-study"
Repository = "https://github.com/inevolin/claude-code-compaction-study"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cc-usage-simulate = "cc_usage_study.simulate:main"
cc-usage-analyze = "cc_usage_study.analyze:main"
cc-usage-benchmark = "cc_usage_study.benchmark:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=benchmarks --ignore=fixtures"
