<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Animated explainer. The problem: after a 10-minute break, the same small Claude Code fix uses about 10 times as much of your usage limit as in a new session (the resumed session held 97k tokens). Why: with an API key the session is cached for 5 minutes (1 hour on a subscription); after that the whole history is sent again. Fresh start 1x, back within 5 minutes 1.5x, back after 10 minutes about 10x. What to do: avoid resuming after a break (about 10x), /compact after a break (about 10x), and turning off a tool mid-task (22x a normal turn, 2 runs). Do run /compact before a break (2.5x), /clear plus a 3-line note after one (about 1x, a fresh start), and stay in the session for quick fixes in a row (28% less than /clear between fixes, 1 run). Star this repo if you found it useful."><title>Claude Code usage anti-patterns and best-practices</title><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.bg{fill:#FAF9F5}.card{fill:#FFFFFF;stroke:#E8E6DC}.ink{fill:#141413}.muted{fill:#5E5D59}.acc{fill:#D97757}.good{fill:#3D3929}.bar{fill:#D1CFC5}.dot{fill:#D1CFC5}@media (prefers-color-scheme:dark){.bg{fill:#1F1E1D}.card{fill:#262624;stroke:#3D3929}.ink{fill:#F0EEE6}.muted{fill:#A6A39A}.good{fill:#C2C0B6}.bar{fill:#5E5D59}.dot{fill:#5E5D59}}@keyframes a0{0.000%{opacity:0}2.045%{opacity:1}20.682%{opacity:1}22.727%{opacity:0}100.000%{opacity:0}}.a0{opacity:0;animation:a0 22.0s linear infinite both}@keyframes a1{0.000%{opacity:0}22.727%{opacity:0}24.773%{opacity:1}45.682%{opacity:1}47.727%{opacity:0}100.000%{opacity:0}}.a1{opacity:0;animation:a1 22.0s linear infinite both}@keyframes a2{0.000%{opacity:0}47.727%{opacity:0}49.773%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a2{opacity:0;animation:a2 22.0s linear infinite both}@keyframes a3{0.000%{opacity:0}50.455%{opacity:0}52.500%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a3{opacity:0;animation:a3 22.0s linear infinite both}@keyframes a4{0.000%{opacity:0}52.045%{opacity:0}54.091%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a4{opacity:0;animation:a4 22.0s linear infinite both}@keyframes a5{0.000%{opacity:0}53.636%{opacity:0}55.682%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a5{opacity:0;animation:a5 22.0s linear infinite both}@keyframes a6{0.000%{opacity:0}55.227%{opacity:0}57.273%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a6{opacity:0;animation:a6 22.0s linear infinite both}@keyframes a7{0.000%{opacity:0}56.818%{opacity:0}58.864%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a7{opacity:0;animation:a7 22.0s linear infinite both}@keyframes a8{0.000%{opacity:0}58.409%{opacity:0}60.455%{opacity:1}79.773%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.a8{opacity:0;animation:a8 22.0s linear infinite both}@keyframes a9{0.000%{opacity:0}81.818%{opacity:0}83.864%{opacity:1}97.955%{opacity:1}100.000%{opacity:0}}.a9{opacity:0;animation:a9 22.0s linear infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}.static,.static g{opacity:1!important}.static circle{opacity:0}.rm{opacity:1}}</style><rect width="1200" height="675" rx="24" class="bg"/><g class="a0"><text x="80" y="92" font-size="24" font-weight="700" text-anchor="start" class="acc" letter-spacing="3">THE PROBLEM</text><text x="80" y="180" font-size="46" font-weight="700" text-anchor="start" class="ink">Same small fix. You just took a coffee break.</text><text x="80" y="245" font-size="46" font-weight="700" text-anchor="start" class="acc">It uses 10 times as much of your usage limit.</text><text x="80" y="372" font-size="32" font-weight="500" text-anchor="start" class="ink">In a new session</text><rect x="430" y="330" width="56" height="56" rx="8" class="bar"/><text x="80" y="472" font-size="32" font-weight="500" text-anchor="start" class="ink">After a 10-min break</text><rect x="430" y="430" width="56" height="56" rx="8" class="acc"/><rect x="496" y="430" width="56" height="56" rx="8" class="acc"/><rect x="562" y="430" width="56" height="56" rx="8" class="acc"/><rect x="628" y="430" width="56" height="56" rx="8" class="acc"/><rect x="694" y="430" width="56" height="56" rx="8" class="acc"/><rect x="760" y="430" width="56" height="56" rx="8" class="acc"/><rect x="826" y="430" width="56" height="56" rx="8" class="acc"/><rect x="892" y="430" width="56" height="56" rx="8" class="acc"/><rect x="958" y="430" width="56" height="56" rx="8" class="acc"/><rect x="1024" y="430" width="56" height="56" rx="8" class="acc"/><text x="80" y="590" font-size="24" font-weight="400" text-anchor="start" class="muted">1 block = one small fix in a new session. The resumed session held 97k tokens.</text><circle cx="555.0" cy="625" r="7" class="acc"/><circle cx="585.0" cy="625" r="7" class="dot"/><circle cx="615.0" cy="625" r="7" class="dot"/><circle cx="645.0" cy="625" r="7" class="dot"/></g><g class="a1"><text x="80" y="92" font-size="24" font-weight="700" text-anchor="start" class="acc" letter-spacing="3">WHY</text><text x="80" y="180" font-size="42" font-weight="600" text-anchor="start" class="ink">Your session is cached for 5 minutes (API key).</text><text x="80" y="240" font-size="42" font-weight="600" text-anchor="start" class="ink">After that, the whole history is sent again.</text><text x="80" y="340" font-size="32" font-weight="500" text-anchor="start" class="ink">Fresh start</text><rect x="420" y="300" width="62" height="56" rx="8" class="bar"/><text x="500.0" y="341" font-size="38" font-weight="800" text-anchor="start" class="ink">1x</text><text x="80" y="430" font-size="32" font-weight="500" text-anchor="start" class="ink">Back within 5 min</text><rect x="420" y="390" width="93" height="56" rx="8" class="bar"/><text x="531.0" y="431" font-size="38" font-weight="800" text-anchor="start" class="ink">1.5x</text><text x="80" y="520" font-size="32" font-weight="500" text-anchor="start" class="ink">Back after 10 min</text><rect x="420" y="480" width="620" height="56" rx="8" class="acc"/><text x="1058.0" y="521" font-size="38" font-weight="800" text-anchor="start" class="acc">~10x</text><text x="80" y="590" font-size="24" font-weight="400" text-anchor="start" class="muted">On a subscription the cache lasts 1 hour.</text><circle cx="555.0" cy="625" r="7" class="dot"/><circle cx="585.0" cy="625" r="7" class="acc"/><circle cx="615.0" cy="625" r="7" class="dot"/><circle cx="645.0" cy="625" r="7" class="dot"/></g><g class="a2 static"><text x="80" y="92" font-size="24" font-weight="700" text-anchor="start" class="acc" letter-spacing="3">WHAT TO DO</text><rect x="56" y="140" width="528" height="430" rx="18" class="card" stroke-width="2"/><text x="80" y="210" font-size="46" font-weight="800" text-anchor="start" class="acc">✕  Avoid</text><g class="a3"><text x="80" y="300" font-size="36" font-weight="800" text-anchor="start" class="acc">~10x</text><text x="198" y="300" font-size="30" font-weight="500" text-anchor="start" class="ink">Resume after a break</text><text x="198" y="332" font-size="22" font-weight="400" text-anchor="start" class="muted">vs a fresh start</text></g><g class="a4"><text x="80" y="395" font-size="36" font-weight="800" text-anchor="start" class="acc">~10x</text><text x="198" y="395" font-size="30" font-weight="500" text-anchor="start" class="ink">/compact after a break</text><text x="198" y="427" font-size="22" font-weight="400" text-anchor="start" class="muted">vs a fresh start</text></g><g class="a5"><text x="80" y="490" font-size="36" font-weight="800" text-anchor="start" class="acc">22x</text><text x="198" y="490" font-size="30" font-weight="500" text-anchor="start" class="ink">Turn off a tool mid-task</text><text x="198" y="522" font-size="22" font-weight="400" text-anchor="start" class="muted">vs a normal turn, 2 runs</text></g><rect x="616" y="140" width="528" height="430" rx="18" class="card" stroke-width="2"/><text x="640" y="210" font-size="46" font-weight="800" text-anchor="start" class="good">✓  Do</text><g class="a6"><text x="640" y="300" font-size="36" font-weight="800" text-anchor="start" class="good">2.5x</text><text x="758" y="300" font-size="30" font-weight="500" text-anchor="start" class="ink">/compact before a break</text><text x="758" y="332" font-size="22" font-weight="400" text-anchor="start" class="muted">vs a fresh start</text></g><g class="a7"><text x="640" y="395" font-size="36" font-weight="800" text-anchor="start" class="good">~1x</text><text x="758" y="395" font-size="30" font-weight="500" text-anchor="start" class="ink">/clear + 3-line note</text><text x="758" y="427" font-size="22" font-weight="400" text-anchor="start" class="muted">it is a fresh start</text></g><g class="a8"><text x="640" y="490" font-size="36" font-weight="800" text-anchor="start" class="good">-28%</text><text x="758" y="490" font-size="30" font-weight="500" text-anchor="start" class="ink">Same session, quick fixes</text><text x="758" y="522" font-size="22" font-weight="400" text-anchor="start" class="muted">vs /clear between fixes, 1 run</text></g><circle cx="555.0" cy="625" r="7" class="dot"/><circle cx="585.0" cy="625" r="7" class="dot"/><circle cx="615.0" cy="625" r="7" class="acc"/><circle cx="645.0" cy="625" r="7" class="dot"/></g><g class="a9"><text x="600.0" y="300" font-size="150" font-weight="400" text-anchor="middle" class="acc">★</text><text x="600.0" y="410" font-size="54" font-weight="700" text-anchor="middle" class="ink">Star this repo if you found it useful</text><text x="600.0" y="470" font-size="28" font-weight="400" text-anchor="middle" class="muted">github.com/inevolin/claude-code-usage-analysis</text><circle cx="555.0" cy="625" r="7" class="dot"/><circle cx="585.0" cy="625" r="7" class="dot"/><circle cx="615.0" cy="625" r="7" class="dot"/><circle cx="645.0" cy="625" r="7" class="acc"/></g><g c